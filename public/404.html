<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>筋トレ記録</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This redirects a deep-linked path (e.g. /muscle-training-app/rm) into
      // a query string GitHub Pages can serve (index.html), which index.html
      // then decodes back into the real path for the client-side router.
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search
            ? '&' + l.search.slice(1).replace(/&/g, '~and~')
            : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
